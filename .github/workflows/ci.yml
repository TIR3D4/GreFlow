name: CI and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Formatting, unit tests and vet
        run: |
          test -z "$(gofmt -l cmd core firewall)"
          go test -race -cover ./...
          go vet ./...
      - name: Install kernel test tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 iptables iputils-ping conntrack shellcheck
      - name: Shell lint
        run: shellcheck install.sh uninstall.sh scripts/*.sh tests/*.sh
      - name: Build amd64 and arm64
        run: bash scripts/build.sh
      - name: Real kernel integration tests
        run: |
          sudo modprobe ip_gre
          sudo bash tests/integration.sh ./dist/greflow-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: greflow-v0.1.0-linux
          path: dist/*
  release:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: greflow-v0.1.0-linux
          path: dist
      - name: Publish first validated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo 'v0.1.0 already published; existing release left intact.'
          else
            gh release create v0.1.0 dist/* --target "$GITHUB_SHA" --title 'GreFlow v0.1.0' --notes-file docs/release-v0.1.0.md
          fi
