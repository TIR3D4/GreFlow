name: CI and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Formatting, unit tests and vet
        run: |
          test -z "$(gofmt -l cmd core firewall)"
          go test -race -cover ./...
          go vet ./...
      - name: Install kernel test tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 iptables iputils-ping conntrack shellcheck
      - name: Shell lint
        run: shellcheck install.sh uninstall.sh scripts/*.sh tests/*.sh
      - name: Build amd64 and arm64
        run: bash scripts/build.sh
      - name: Real kernel integration tests
        run: |
          sudo modprobe ip_gre
          sudo bash tests/integration.sh ./dist/greflow-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: greflow-linux
          path: dist/*
  release:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: greflow-linux
          path: dist
      - name: Publish validated version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(tr -d '\r\n' < VERSION)"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo 'A newer commit exists; skip release of stale source.'
          elif gh release view "$version" >/dev/null 2>&1; then
            echo "$version already published; existing release left intact."
          else
            gh release create "$version" dist/* --target "$GITHUB_SHA" --title "GreFlow $version" --notes-file "docs/release-$version.md"
          fi
      - name: Verify published installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(tr -d '\r\n' < VERSION)"
          if gh release view "$version" >/dev/null 2>&1; then
            sudo env GREFLOW_VERSION="$version" bash install.sh
            test "$(greflow version)" = "GreFlow $version"
          else
            echo 'Release skipped for stale source; installer smoke test deferred.'
          fi
