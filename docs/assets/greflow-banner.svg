<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
<title id="title">GreFlow Console — one clear view of your tunnels</title><desc id="desc">A lilac and blue GreFlow banner with an abstract server management panel. Windows and Linux, Persian RTL interface, real SSH.</desc>
